xt x="468" y="351" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">12.8/day</text><rect x="580" y="278.5" width="76" height="25.5" fill="url(#hatch)" rx="3" opacity="1"/><text x="618" y="270.5" fill="var(--c-ink)" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">45</text><text x="618" y="322" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="middle">September</text><text x="618" y="337" fill="var(--c-warn)" font-size="9.5" font-weight="700" text-anchor="middle">PARTIAL</text><text x="618" y="351" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6.4 – 9.0/day</text><line x1="0" y1="366" x2="760" y2="366" stroke="var(--c-grid)" stroke-width="1"/><text x="0" y="384" fill="var(--c-ink)" font-size="10.5" font-weight="400" text-anchor="start">July → August: +75.2% (396 / 226).   Last 30 days: 366 signups → 0 paying customers.</text><text x="0" y="399" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">Monthly totals sum to 686 against a 682 baseline — the two queries were run on different dates. See the reconciliation note.</text></svg>