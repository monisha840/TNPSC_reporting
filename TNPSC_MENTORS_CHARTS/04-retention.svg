xt><text x="190" y="217" fill="var(--c-ink)" font-size="11" font-weight="600" text-anchor="end">Active last 7 days</text><rect x="200" y="204" width="11.466275659824046" height="18" fill="var(--c-accent)" rx="2" opacity="0.85"/><text x="219.46627565982405" y="217" fill="var(--c-ink)" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">17</text><text x="247.46627565982405" y="217" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2.5% of 682</text><text x="190" y="247" fill="var(--c-ink)" font-size="11" font-weight="600" text-anchor="end">Ever had 2+ active days</text><rect x="200" y="234" width="10.791788856304985" height="18" fill="var(--c-accent)" rx="2" opacity="0.85"/><text x="218.79178885630498" y="247" fill="var(--c-ink)" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">16</text><text x="246.79178885630498" y="247" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2.3% of 682</text><text x="190" y="277" fill="var(--c-ink)" font-size="11" font-weight="600" text-anchor="end">Active today</text><rect x="200" y="264" width="3" height="18" fill="var(--c-accent)" rx="2" opacity="0.85"/><text x="211" y="277" fill="var(--c-ink)" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2</text><text x="231" y="277" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0.3% of 682</text><line x1="0" y1="308" x2="760" y2="308" stroke="var(--c-grid)" stroke-width="1"/><text x="0" y="326" fill="var(--c-warn)" font-size="11" font-weight="700" text-anchor="start">D1 / D3 / D7 / D14 / D30 cohort retention