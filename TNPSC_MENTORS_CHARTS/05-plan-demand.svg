<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Checkout attempts and conversions by plan" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><style>
    svg{--c-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--c-ink:#14181d;--c-muted:#5b6472;--c-faint:#8892a0;--c-grid:#e2e6ec;--c-panel:#f5f7fa;--c-surface:#ffffff;--c-accent:#2f5fd0;--c-danger:#b42318;--c-warn:#b54708;--c-good:#067647;--c-neutral:#98a2b3;--c-accent2:#7b4fd0}
    @media (prefers-color-scheme: dark){svg{--c-ink:#e8ecf2;--c-muted:#9aa4b4;--c-faint:#6f7987;--c-grid:#2a3138;--c-panel:#1a1f26;--c-surface:#12161b;--c-accent:#7ea6ff;--c-danger:#f28b82;--c-warn:#e5a663;--c-good:#5fd4a0;--c-neutral:#6b7684;--c-accent2:#b195f5}}
    text{font-family:var(--c-font,system-ui,sans-serif)}
  </style><rect width="760" height="330" fill="var(--c-surface)"/><text x="0" y="18" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">Plan demand vs. conversion — the most wanted plan has never sold</text><text x="0" y="36" fill="var(--c-muted)" font-size="11.5" font-weight="400" text-anchor="start">21 price-accepted checkout attempts across 4 ledger plan keys. Sample far too small for any rate to be meaningful.</text><text x="178" y="91" fill="var(--c-ink)" font-size="12" font-weight="600" text-anchor="end">Premium Prelims Kit</text><text x="178" y="105" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">₹1,699</text><rect x="190" y="76" width="360" height="22" fill="var(--c-accent)" rx="2" opacity="0.85"/><text x="560" y="92" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">12 attempts</text><text x="650" y="92" fill="var(--c-danger)" font-size="11.5" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0 paid</text><text x="178" y="135" fill="var(--c-ink)" font-size="12" font-weight="600" text-anchor="end">Vettri Nichayam</text><text x="178" y="149" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">₹899</text><rect x="190" y="120" width="120" height="22" fill="var(--c-accent)" rx="2" opacity="0.85"/><rect x="190" y="120" width="30" height="22" fill="var(--c-good)" rx="2"/><text x="320" y="136" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4 attempts</text><text x="410" y="136" fill="var(--c-good)" font-size="11.5" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1 paid</text><text x="178" y="179" fill="var(--c-ink)" font-size="12" font-weight="600" text-anchor="end">Rank Booster G2</text><text x="178" y="193" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">₹1,249</text><rect x="190" y="164" width="90" height="22" fill="var(--c-accent)" rx="2" opacity="0.85"/><text x="290" y="180" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3 attempts</text><text x="380" y="180" fill="var(--c-danger)" font-size="11.5" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0 paid</text><text x="178" y="223" fill="var(--c-ink)" font-size="12" font-weight="600" text-anchor="end">Group 1 Mock Pack</text><text x="178" y="237" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">₹399</text><rect x="190" y="208" width="60" height="22" fill="var(--c-accent)" rx="2" opacity="0.85"/><text x="260" y="224" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2 attempts</text><text x="350" y="224" fill="var(--c-danger)" font-size="11.5" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0 paid</text><line x1="0" y1="262" x2="760" y2="262" stroke="var(--c-grid)" stroke-width="1"/><text x="0" y="282" fill="var(--c-ink)" font-size="11" font-weight="600" text-anchor="start">Premium draws 57% of all purchase intent (12 of 21) at the highest price point — and has converted 0 times.</text><text x="0" y="299" fill="var(--c-danger)" font-size="11" font-weight="600" text-anchor="start">The single Vettri sale was FOUNDER-GENERATED. Externally-acquired paying customers: 0.</text><text x="0" y="317" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">OBSERVATION, not fact: two explanations fit equally — price resistance at ₹1,699, or plan confusion driving users to</text><text x="0" y="332" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">the most prominent option and then stalling. Neither is proven. See Flaw #2.</text></svg>