<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" role="img" aria-label="Root cause tree from low revenue through conversion, activation, retention and measurement gaps" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><style>
    svg{--c-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--c-ink:#14181d;--c-muted:#5b6472;--c-faint:#8892a0;--c-grid:#e2e6ec;--c-panel:#f5f7fa;--c-surface:#ffffff;--c-accent:#2f5fd0;--c-danger:#b42318;--c-warn:#b54708;--c-good:#067647;--c-neutral:#98a2b3;--c-accent2:#7b4fd0}
    @media (prefers-color-scheme: dark){svg{--c-ink:#e8ecf2;--c-muted:#9aa4b4;--c-faint:#6f7987;--c-grid:#2a3138;--c-panel:#1a1f26;--c-surface:#12161b;--c-accent:#7ea6ff;--c-danger:#f28b82;--c-warn:#e5a663;--c-good:#5fd4a0;--c-neutral:#6b7684;--c-accent2:#b195f5}}
    text{font-family:var(--c-font,system-ui,sans-serif)}
  </style><rect width="900" height="780" fill="var(--c-surface)"/><text x="0" y="18" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">Root cause tree</text><text x="0" y="36" fill="var(--c-muted)" font-size="11.5" font-weight="400" text-anchor="start">Every node is labelled FACT, OBSERVATION or HYPOTHESIS. The certainty of a parent does not transfer to its children.</text><rect x="0" y="74" width="900" height="42" fill="var(--c-panel)" rx="6"/><rect x="0" y="74" width="4" height="42" fill="var(--c-danger)" rx="2"/><text x="16" y="94" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">LOW REVENUE</text><text x="16" y="109" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">₹899 all-time · ₹0 externally generated · 0 external customers in 83 days</text><rect x="848" y="86" width="44" height="17" fill="var(--c-good)" rx="3" opacity="0.18"/><text x="870" y="98" fill="var(--c-good)" font-size="9.5" font-weight="700" text-anchor="middle">FACT</text><text x="28" y="146" fill="var(--c-ink)" font-size="13" font-weight="700" text-anchor="start">Low conversion</text><text x="28" y="160" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start">11 people reached checkout, 1 bought (founder-generated). 366 signups in 30 days → 0 paid.</text><rect x="848" y="136" width="44" height="17" fill="var(--c-good)" rx="3" opacity="0.18"/><text x="870" y="148" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">FACT</text><line x1="40" y1="182" x2="56" y2="182" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="186" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Weak value perception</text><rect x="268" y="173" width="78" height="16" fill="var(--c-danger)" rx="3" opacity="0.16"/><text x="307" y="185" fill="var(--c-danger)" font-size="8.5" font-weight="700" text-anchor="middle">HYPOTHESIS</text><text x="356" y="186" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Strongest available explanation. Supported by walkthrough (n=1) and consistent with al…</text><text x="892" y="186" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#1</text><line x1="40" y1="208" x2="56" y2="208" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="212" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Pricing complexity</text><rect x="268" y="199" width="78" height="16" fill="var(--c-warn)" rx="3" opacity="0.16"/><text x="307" y="211" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">OBSERVATION</text><text x="356" y="212" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Entitlement overlap is code-confirmed FACT. That it suppresses conversion is an observ…</text><text x="892" y="212" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#2</text><line x1="40" y1="234" x2="56" y2="234" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="238" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Weak trust</text><rect x="268" y="225" width="78" height="16" fill="var(--c-good)" rx="3" opacity="0.16"/><text x="307" y="237" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">FACT</text><text x="356" y="238" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Zero testimonials, ratings or user counts anywhere on the acquisition or pricing surfa…</text><text x="892" y="238" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#1</text><line x1="40" y1="260" x2="56" y2="260" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="264" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Expired offer</text><rect x="268" y="251" width="78" height="16" fill="var(--c-good)" rx="3" opacity="0.16"/><text x="307" y="263" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">FACT</text><text x="356" y="264" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Offer expired 31 Aug 2026, still visible 5 Sep on the dedicated paid-ads landing page.</text><text x="892" y="264" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#3</text><line x1="40" y1="286" x2="56" y2="286" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="290" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Price resistance at ₹1,699</text><rect x="268" y="277" width="78" height="16" fill="var(--c-danger)" rx="3" opacity="0.16"/><text x="307" y="289" fill="var(--c-danger)" font-size="8.5" font-weight="700" text-anchor="middle">HYPOTHESIS</text><text x="356" y="290" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Competes with pricing complexity as the explanation for premium_annual's 0/12. The two…</text><text x="892" y="290" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#2</text><line x1="40" y1="154" x2="40" y2="286" stroke="var(--c-grid)" stroke-width="1.5"/><text x="28" y="332" fill="var(--c-ink)" font-size="13" font-weight="700" text-anchor="start">Low activation</text><text x="28" y="346" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start">337 of 682 registered users (49.4%) never start a single test.</text><rect x="848" y="322" width="44" height="17" fill="var(--c-good)" rx="3" opacity="0.18"/><text x="870" y="334" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">FACT</text><line x1="40" y1="368" x2="56" y2="368" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="372" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Poor orientation</text><rect x="268" y="359" width="78" height="16" fill="var(--c-warn)" rx="3" opacity="0.16"/><text x="307" y="371" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">OBSERVATION</text><text x="356" y="372" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">&quot;I don't know what is so necessary and what should I do now.&quot; Walkthrough n=1; the 337…</text><text x="892" y="372" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#4</text><line x1="40" y1="394" x2="56" y2="394" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="398" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Navigation friction</text><rect x="268" y="385" width="78" height="16" fill="var(--c-warn)" rx="3" opacity="0.16"/><text x="307" y="397" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">OBSERVATION</text><text x="356" y="398" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">3–4 taps between entry and the only thing that delivers value.</text><text x="892" y="398" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#4</text><line x1="40" y1="420" x2="56" y2="420" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="424" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Popup overload</text><rect x="268" y="411" width="78" height="16" fill="var(--c-warn)" rx="3" opacity="0.16"/><text x="307" y="423" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">OBSERVATION</text><text x="356" y="424" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Five competing entry modals confirmed in code; the felt experience is walkthrough evid…</text><text x="892" y="424" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#4</text><line x1="40" y1="340" x2="40" y2="420" stroke="var(--c-grid)" stroke-width="1.5"/><text x="28" y="466" fill="var(--c-ink)" font-size="13" font-weight="700" text-anchor="start">Low retention</text><text x="28" y="480" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start">270 of 286 completers (94.4%) never returned. 16 of 682 have ever had two active days.</text><rect x="848" y="456" width="44" height="17" fill="var(--c-good)" rx="3" opacity="0.18"/><text x="870" y="468" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">FACT</text><line x1="40" y1="502" x2="56" y2="502" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="506" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Weak habit loop</text><rect x="268" y="493" width="78" height="16" fill="var(--c-warn)" rx="3" opacity="0.16"/><text x="307" y="505" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">OBSERVATION</text><text x="356" y="506" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Nothing in the product creates a reason to open it tomorrow.</text><text x="892" y="506" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#6</text><line x1="40" y1="528" x2="56" y2="528" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="532" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Poor content surfacing</text><rect x="268" y="519" width="78" height="16" fill="var(--c-warn)" rx="3" opacity="0.16"/><text x="307" y="531" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">OBSERVATION</text><text x="356" y="532" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Current Affairs images not loading; Kural of the Day has no prompt; the free tier is u…</text><text x="892" y="532" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#7</text><line x1="40" y1="554" x2="56" y2="554" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="558" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Partial effort not reinforced</text><rect x="268" y="545" width="78" height="16" fill="var(--c-good)" rx="3" opacity="0.16"/><text x="307" y="557" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">FACT</text><text x="356" y="558" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Streaks, XP and badges are written exclusively by submit_test. Answer 20 questions and…</text><text x="892" y="558" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#6</text><line x1="40" y1="474" x2="40" y2="554" stroke="var(--c-grid)" stroke-width="1.5"/><text x="28" y="600" fill="var(--c-ink)" font-size="13" font-weight="700" text-anchor="start">Measurement gaps</text><text x="28" y="614" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start">Several conclusions above cannot currently be confirmed or refuted, because the data to do so does not exist.</text><rect x="848" y="590" width="44" height="17" fill="var(--c-good)" rx="3" opacity="0.18"/><text x="870" y="602" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">FACT</text><line x1="40" y1="636" x2="56" y2="636" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="640" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Attribution</text><rect x="268" y="627" width="78" height="16" fill="var(--c-good)" rx="3" opacity="0.16"/><text x="307" y="639" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">FACT</text><text x="356" y="640" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">No utm_source / medium / campaign / referrer column exists anywhere in the schema.</text><text x="892" y="640" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#12</text><line x1="40" y1="662" x2="56" y2="662" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="666" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Event tracking</text><rect x="268" y="653" width="78" height="16" fill="var(--c-good)" rx="3" opacity="0.16"/><text x="307" y="665" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">FACT</text><text x="356" y="666" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Paid-format abandonment cannot be logged; Google signups are not counted as signups; p…</text><text x="892" y="666" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#13</text><line x1="40" y1="688" x2="56" y2="688" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="692" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Feedback</text><rect x="268" y="679" width="78" height="16" fill="var(--c-good)" rx="3" opacity="0.16"/><text x="307" y="691" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">FACT</text><text x="356" y="692" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">6 ratings, 0 words, from 682 users. No qualitative signal exists in the system at all.</text><text x="892" y="692" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#14</text><line x1="40" y1="714" x2="56" y2="714" stroke="var(--c-grid)" stroke-width="1.5"/><text x="64" y="718" fill="var(--c-ink)" font-size="11.5" font-weight="600" text-anchor="start">Incomplete funnel</text><rect x="268" y="705" width="78" height="16" fill="var(--c-good)" rx="3" opacity="0.16"/><text x="307" y="717" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">FACT</text><text x="356" y="718" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">No visitor store and no pricing-view event — the funnel has neither a top nor a valid …</text><text x="892" y="718" fill="var(--c-accent)" font-size="10" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#13</text><line x1="40" y1="608" x2="40" y2="714" stroke="var(--c-grid)" stroke-width="1.5"/><line x1="0" y1="744" x2="900" y2="744" stroke="var(--c-grid)" stroke-width="1"/><rect x="0" y="758" width="10" height="10" fill="var(--c-good)" rx="2"/><text x="16" y="767" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start">FACT — measured directly — a claim you can verify in one lookup</text><rect x="0" y="776" width="10" height="10" fill="var(--c-warn)" rx="2"/><text x="16" y="785" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start">OBSERVATION — a real pattern; causality not established</text><rect x="0" y="794" width="10" height="10" fill="var(--c-danger)" rx="2"/><text x="16" y="803" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start">HYPOTHESIS — plausible and evidence-linked, but unproven</text></svg>