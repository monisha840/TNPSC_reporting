  </style><rect width="900" height="552" fill="var(--c-surface)"/><text x="0" y="18" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">Event tracking coverage</text><text x="0" y="36" fill="var(--c-muted)" font-size="11.5" font-weight="400" text-anchor="start">Green = reliable. Amber = fires but incomplete. Red = does not exist. Two funnel stages have no data source at all.</text><text x="0" y="74" fill="var(--c-faint)" font-size="9.5" font-weight="700" text-anchor="start">EVENT</text><text x="320" y="74" fill="var(--c-faint)" font-size="9.5" font-weight="700" text-anchor="middle">TRACKED</text><text x="400" y="74" fill="var(--c-faint)" font-size="9.5" font-weight="700" text-anchor="middle">RELIABLE</text><text x="450" y="74" fill="var(--c-faint)" font-size="9.5" font-weight="700" text-anchor="start">PROBLEM</text><rect x="-6" y="80" width="912" height="26" fill="var(--c-panel)" rx="2" opacity="0.6"/><text x="0" y="97" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">page_view</text><rect x="292" y="85" width="56" height="16" fill="var(--c-good)" rx="3" opacity="0.2"/><text x="320" y="97" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">Yes</text><rect x="372" y="85" width="56" height="16" fill="var(--c-good)" rx="3" opacity="0.2"/><text x="400" y="97" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">Yes</text><text x="450" y="97" fill="var(--c-faint)" font-size="9.5" font-weight="400" text-anchor="start">—</text><text x="0" y="123" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">sign_up</text><rect x="292" y="111" width="56" height="16" fill="var(--c-warn)" rx="3" opacity="0.2"/><text x="320" y="123" fill="var(--c-warn)" font-size="9" font-weight="700" text-anchor="middle">Partial</text><rect x="372" y="111" w