hor="middle">Yes</text><rect x="372" y="319" width="56" height="16" fill="var(--c-good)" rx="3" opacity="0.2"/><text x="400" y="331" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">Yes</text><text x="450" y="331" fill="var(--c-faint)" font-size="9.5" font-weight="400" text-anchor="start">—</text><rect x="-6" y="340" width="912" height="26" fill="var(--c-panel)" rx="2" opacity="0.6"/><text x="0" y="357" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">purchase</text><rect x="292" y="345" width="56" height="16" fill="var(--c-good)" rx="3" opacity="0.2"/><text x="320" y="357" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">Yes</text><rect x="372" y="345" width="56" height="16" fill="var(--c-good)" rx="3" opacity="0.2"/><text x="400" y="357" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">Yes</text><text x="450" y="357" fill="var(--c-faint)" font-size="9.5" font-weight="400" text-anchor="start">—</text><text x="0" y="383" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">coupon_applied</text><rect x="292" y="371" width="56" height="16" fill="var(--c-good)" rx="3" opacity="0.2"/><text x="320" y="383" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">Yes</text><rect x="372" y="371" width="56" height="16" fill="var(--c-good)" rx="3" opacity="0.2"/><text x="400" y="383" fill="var(--c-good)" font-size="9" font-weight="700" text-anchor="middle">Yes</text><text x="450" y="383" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">coupon_viewed is not tracked separately, so it is impossible to tell whether nobody look…</text><rect x="-6" y="392" width="912" height="26" fill="var(--c-panel)" rx="2" opacity="0.6"/><text x="0" y="409" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">subscription_renewed / expired / cancelled</text><rect x="292" y="397" width="56" height="16" fill="var(--c-danger)" rx="3" opacity="0.2"/><text x="320" y="409" fill="var(--c-danger)" font-size="9" font-weight="700" text-anchor="middle">No</text><rect x="372" y="397" width="56" height="16" fill="var(--c-neutral)" rx="3" opacity="0.2"/><text x="400" y="409" fill="var(--c-neutral)" font-size="9" font-weight="700" text-anchor="middle">n/a</text><text x="450" y="409" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Plan expiry is computed on read via bundleAccess(), never written as an event. Renewal a…</text><text x="0" y="435" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">utm_source / medium / campaign / referrer</text><rect x="292" y="423" width="56" height="16" fill="var(--c-danger)" rx="3" opacity="0.2"/><text x="320" y="435" fill="var(--c-danger)" font-size="9" font-weight="700" text-anchor="middle">No</text><rect x="372" y="423" width="56" height="16" fill="var(--c-neutral)" rx="3" opacity="0.2"/><text x="400" y="435" fill="var(--c-neutral)" font-size="9" font-weight="700" text-anchor="middle">n/a</text><text x="450" y="435" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">Exhaustive schema search returned one non-match. Historical channel attribution is unrec…</text><rect x="-6" y="444" width="912" height="26" fill="var(--c-panel)" rx="2" opacity="0.6"/><text x="0" y="461" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Server-side pageview / visitor count</text><rect x="292" y="449" width="56" height="16" fill="var(--c-danger)" rx="3" opacity="0.2"/><text x="320" y="461" fill="var(--c-danger)" font-size="9" font-weight="700" text-anchor="middle">No</text><rect x="372" y="449" width="56" height="16" fill="var(--c-neutral)" rx="3" opacity="0.2"/><text x="400" y="461" fill="var(--c-neutral)" font-size="9" font-weight="700" text-anchor="middle">n/a</text><text x="450" y="461" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">The funnel has no top. Visitor volume is knowable only through GA4, which cannot be join…</text><line x1="0" y1="488" x2="900" y2="488" stroke="var(--c-grid)" stroke-width="1"/><text x="0" y="508" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start">The instrumentation that exists is well built — single, correct choke-points. It is INCOMPLETE, not sloppy.</text><text x="0" y="525" fill="var(--c-danger)" font-size="10.5" font-weight="600" text-anchor="start">Ship pricing_viewed first: without it the checkout funnel stage has no denominator and Phase 1 cannot be evaluated.</text><text x="0" y="542" fill="var(--c-faint)" font-size="10" font-weight="400" text-anchor="start">[CODE] exhaustive call-site enumeration across the full src/ and server/ trees.</text></svg>