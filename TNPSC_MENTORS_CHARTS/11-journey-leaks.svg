<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" role="img" aria-label="End-to-end user journey leakage map" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><style>
    svg{--c-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--c-ink:#14181d;--c-muted:#5b6472;--c-faint:#8892a0;--c-grid:#e2e6ec;--c-panel:#f5f7fa;--c-surface:#ffffff;--c-accent:#2f5fd0;--c-danger:#b42318;--c-warn:#b54708;--c-good:#067647;--c-neutral:#98a2b3;--c-accent2:#7b4fd0}
    @media (prefers-color-scheme: dark){svg{--c-ink:#e8ecf2;--c-muted:#9aa4b4;--c-faint:#6f7987;--c-grid:#2a3138;--c-panel:#1a1f26;--c-surface:#12161b;--c-accent:#7ea6ff;--c-danger:#f28b82;--c-warn:#e5a663;--c-good:#5fd4a0;--c-neutral:#6b7684;--c-accent2:#b195f5}}
    text{font-family:var(--c-font,system-ui,sans-serif)}
  </style><rect width="900" height="542" fill="var(--c-surface)"/><text x="0" y="18" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">End-to-end journey — where it leaks</text><text x="0" y="36" fill="var(--c-muted)" font-size="11.5" font-weight="400" text-anchor="start">Fourteen stages from discovery to referral. Stages marked UNMEASURED cannot be quantified because the instrumentation does not exist.</text><rect x="-6" y="78" width="912" height="30" fill="var(--c-panel)" rx="2" opacity="0.55"/><rect x="0" y="84" width="4" height="18" fill="var(--c-neutral)" rx="2"/><text x="14" y="97" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">DISCOVERY</text><rect x="150" y="84" width="172" height="17" fill="var(--c-neutral)" rx="3" opacity="0.18"/><text x="236" y="96" fill="var(--c-neutral)" font-size="8.5" font-weight="700" text-anchor="middle">UNMEASURABLE</text><text x="336" y="97" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">DATA NOT AVAILABLE — no visitor store, no attribution</text><text x="896" y="97" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#10 #11 #12</text><rect x="0" y="114" width="4" height="18" fill="var(--c-neutral)" rx="2"/><text x="14" y="127" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">LANDING</text><rect x="150" y="114" width="172" height="17" fill="var(--c-neutral)" rx="3" opacity="0.18"/><text x="236" y="126" fill="var(--c-neutral)" font-size="8.5" font-weight="700" text-anchor="middle">UNMEASURABLE</text><text x="336" y="127" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">DATA NOT AVAILABLE — landing-page views not stored server-side</text><text x="896" y="127" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#1 #10 #11</text><rect x="-6" y="138" width="912" height="30" fill="var(--c-panel)" rx="2" opacity="0.55"/><rect x="0" y="144" width="4" height="18" fill="var(--c-good)" rx="2"/><text x="14" y="157" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">SIGNUP</text><rect x="150" y="144" width="172" height="17" fill="var(--c-good)" rx="3" opacity="0.18"/><text x="236" y="156" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">HEALTHY — CLOSED</text><text x="336" y="157" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">682 signups · 366 in the last 30 days · 50 in the last 7</text><text x="896" y="157" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#13</text><rect x="0" y="174" width="4" height="18" fill="var(--c-warn)" rx="2"/><text x="14" y="187" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">ONBOARDING</text><rect x="150" y="174" width="172" height="17" fill="var(--c-warn)" rx="3" opacity="0.18"/><text x="236" y="186" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">MAJOR LEAK</text><text x="336" y="187" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">DATA NOT AVAILABLE — no onboarding-completion event</text><text x="896" y="187" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#4 #5</text><rect x="-6" y="198" width="912" height="30" fill="var(--c-panel)" rx="2" opacity="0.55"/><rect x="0" y="204" width="4" height="18" fill="var(--c-danger)" rx="2"/><text x="14" y="217" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">FIRST TEST</text><rect x="150" y="204" width="172" height="17" fill="var(--c-danger)" rx="3" opacity="0.18"/><text x="236" y="216" fill="var(--c-danger)" font-size="8.5" font-weight="700" text-anchor="middle">LARGEST ABSOLUTE LEAK</text><text x="336" y="217" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">50.6% start rate (345 / 682) · 49.4% never start</text><text x="896" y="217" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#4 #5</text><rect x="0" y="234" width="4" height="18" fill="var(--c-good)" rx="2"/><text x="14" y="247" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">RESULT</text><rect x="150" y="234" width="172" height="17" fill="var(--c-good)" rx="3" opacity="0.18"/><text x="236" y="246" fill="var(--c-good)" font-size="8.5" font-weight="700" text-anchor="middle">HEALTHY</text><text x="336" y="247" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">82.9% completion among starters</text><text x="896" y="247" fill="var(--c-faint)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">—</text><rect x="-6" y="258" width="912" height="30" fill="var(--c-panel)" rx="2" opacity="0.55"/><rect x="0" y="264" width="4" height="18" fill="var(--c-danger)" rx="2"/><text x="14" y="277" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">REPEAT USE</text><rect x="150" y="264" width="172" height="17" fill="var(--c-danger)" rx="3" opacity="0.18"/><text x="236" y="276" fill="var(--c-danger)" font-size="8.5" font-weight="700" text-anchor="middle">LARGEST PROPORTIONAL LEAK</text><text x="336" y="277" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">5.6% of completers (16 / 286) · 2.3% of all users (16 / 682) — FLOOR</text><text x="896" y="277" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#6 #7</text><rect x="0" y="294" width="4" height="18" fill="var(--c-warn)" rx="2"/><text x="14" y="307" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">VALUE DISCOVERY</text><rect x="150" y="294" width="172" height="17" fill="var(--c-warn)" rx="3" opacity="0.18"/><text x="236" y="306" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">MAJOR LEAK</text><text x="336" y="307" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">DATA NOT AVAILABLE — no feature-usage event on Revision/Insights</text><text x="896" y="307" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#1 #7</text><rect x="-6" y="318" width="912" height="30" fill="var(--c-panel)" rx="2" opacity="0.55"/><rect x="0" y="324" width="4" height="18" fill="var(--c-accent2)" rx="2"/><text x="14" y="337" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">PRICING</text><rect x="150" y="324" width="172" height="17" fill="var(--c-accent2)" rx="3" opacity="0.18"/><text x="236" y="336" fill="var(--c-accent2)" font-size="8.5" font-weight="700" text-anchor="middle">UNMEASURED</text><text x="336" y="337" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">DATA NOT AVAILABLE — pricing_viewed not instrumented on PricingCards</text><text x="896" y="337" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#1 #2 #11 #13</text><rect x="0" y="354" width="4" height="18" fill="var(--c-warn)" rx="2"/><text x="14" y="367" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">CHECKOUT</text><rect x="150" y="354" width="172" height="17" fill="var(--c-warn)" rx="3" opacity="0.18"/><text x="236" y="366" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">MAJOR LEAK</text><text x="336" y="367" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">11 people · 21 attempts · 1 completed (9.1% of people, 4.8% of attempts)</text><text x="896" y="367" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#2 #9</text><rect x="-6" y="378" width="912" height="30" fill="var(--c-panel)" rx="2" opacity="0.55"/><rect x="0" y="384" width="4" height="18" fill="var(--c-danger)" rx="2"/><text x="14" y="397" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">PAYMENT</text><rect x="150" y="384" width="172" height="17" fill="var(--c-danger)" rx="3" opacity="0.18"/><text x="236" y="396" fill="var(--c-danger)" font-size="8.5" font-weight="700" text-anchor="middle">TERMINAL — ₹0 EXTERNAL</text><text x="336" y="397" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">₹899 all-time · ₹0 externally generated</text><text x="896" y="397" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#8</text><rect x="0" y="414" width="4" height="18" fill="var(--c-accent2)" rx="2"/><text x="14" y="427" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">RETENTION</text><rect x="150" y="414" width="172" height="17" fill="var(--c-accent2)" rx="3" opacity="0.18"/><text x="236" y="426" fill="var(--c-accent2)" font-size="8.5" font-weight="700" text-anchor="middle">UNMEASURED</text><text x="336" y="427" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">DATA NOT AVAILABLE</text><text x="896" y="427" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#6 #13</text><rect x="-6" y="438" width="912" height="30" fill="var(--c-panel)" rx="2" opacity="0.55"/><rect x="0" y="444" width="4" height="18" fill="var(--c-warn)" rx="2"/><text x="14" y="457" fill="var(--c-ink)" font-size="11" font-weight="700" text-anchor="start">REFERRAL</text><rect x="150" y="444" width="172" height="17" fill="var(--c-warn)" rx="3" opacity="0.18"/><text x="236" y="456" fill="var(--c-warn)" font-size="8.5" font-weight="700" text-anchor="middle">BUILT, UNUSED</text><text x="336" y="457" fill="var(--c-muted)" font-size="9.5" font-weight="400" text-anchor="start">0 redemptions · 0 coupon-attributed revenue</text><text x="896" y="457" fill="var(--c-accent)" font-size="9.5" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#9</text><line x1="0" y1="484" x2="900" y2="484" stroke="var(--c-grid)" stroke-width="1"/><text x="0" y="504" fill="var(--c-ink)" font-size="10.5" font-weight="600" text-anchor="start">Largest absolute leak: signup → first test (337 users). Largest proportional leak: completion → return (94.4%).</text><text x="0" y="521" fill="var(--c-good)" font-size="10.5" font-weight="600" text-anchor="start">Signup and checkout are both CONFIRMED WORKING and are closed — do not spend engineering time on either.</text></svg>