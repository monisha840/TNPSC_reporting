<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 264" width="620" height="264" role="img" aria-label="Fourteen flaws grouped by priority: four P0, seven P1, three P2" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><style>
    svg{--c-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--c-ink:#14181d;--c-muted:#5b6472;--c-faint:#8892a0;--c-grid:#e2e6ec;--c-panel:#f5f7fa;--c-surface:#ffffff;--c-accent:#2f5fd0;--c-danger:#b42318;--c-warn:#b54708;--c-good:#067647;--c-neutral:#98a2b3;--c-accent2:#7b4fd0}
    @media (prefers-color-scheme: dark){svg{--c-ink:#e8ecf2;--c-muted:#9aa4b4;--c-faint:#6f7987;--c-grid:#2a3138;--c-panel:#1a1f26;--c-surface:#12161b;--c-accent:#7ea6ff;--c-danger:#f28b82;--c-warn:#e5a663;--c-good:#5fd4a0;--c-neutral:#6b7684;--c-accent2:#b195f5}}
    text{font-family:var(--c-font,system-ui,sans-serif)}
  </style><rect width="620" height="264" fill="var(--c-surface)"/><text x="0" y="18" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">The 14 major flaws by priority</text><text x="0" y="36" fill="var(--c-muted)" font-size="11.5" font-weight="400" text-anchor="start">Consolidated from 35 underlying findings. P3 technical debt is out of scope.</text><rect x="0" y="76" width="170" height="104" fill="var(--c-panel)" rx="8"/><rect x="0" y="76" width="5" height="104" fill="var(--c-danger)" rx="2"/><text x="20" y="128" fill="var(--c-danger)" font-size="40" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4</text><text x="20" y="150" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">P0</text><text x="20" y="168" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">Fix immediately</text><text x="62" y="128" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#1 #2 #3 #8</text><rect x="190" y="76" width="170" height="104" fill="var(--c-panel)" rx="8"/><rect x="190" y="76" width="5" height="104" fill="var(--c-warn)" rx="2"/><text x="210" y="128" fill="var(--c-warn)" font-size="40" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">7</text><text x="210" y="150" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">P1</text><text x="210" y="168" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">High impact</text><text x="252" y="128" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#4 #5 #6 #7 #9 #12 #13</text><rect x="380" y="76" width="170" height="104" fill="var(--c-panel)" rx="8"/><rect x="380" y="76" width="5" height="104" fill="var(--c-neutral)" rx="2"/><text x="400" y="128" fill="var(--c-neutral)" font-size="40" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3</text><text x="400" y="150" fill="var(--c-ink)" font-size="15" font-weight="700" text-anchor="start">P2</text><text x="400" y="168" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">Medium</text><text x="442" y="128" fill="var(--c-muted)" font-size="10" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">#10 #11 #14</text><text x="0" y="210" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">Flaw #8 (weak monetization) is an OUTCOME with no independent fix — it moves when #1, #2, #3 and #9 move.</text><text x="0" y="227" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">Priority note: Flaw #12 (attribution) was P1 in Stage 2 and P2 in the Final Verification. It is assigned P1 here</text><text x="0" y="242" fill="var(--c-muted)" font-size="10.5" font-weight="400" text-anchor="start">because acquisition is now confirmed growing. The source disagreement is disclosed, not silently resolved.</text></svg>